aid: happyornot
name: HappyOrNot
description: >-
  HappyOrNot is a Finnish customer-experience feedback company known for its Smiley
  Terminal, Smiley Touch and Smiley Digital feedback devices used across retail,
  airports, healthcare, public sector and workplaces. Its read-only Customer API v2
  lets applications and BI tools pull raw feedback data — button (smiley/NPS) ratings,
  follow-up selections, freeform text, AI demographics, contact-request details and
  metadata — together with the experience points, groups, surveys, questions, smileys,
  users and alerts that produce it. Authentication is a package-scoped API token
  (X-HON-API-Token header or auth query parameter); responses are JSON or CSV, paged
  with offset/limit and an X-More-Available header. The API is documented with an
  OpenAPI 3.1 specification and integrates with Power BI, Tableau, Salesforce,
  Medallia, Qualtrics and Zapier.
