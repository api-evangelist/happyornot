arazzo: 1.0.1
info:
  title: Resolve an experience point and fetch its button feedback
  version: 1.0.0
  summary: Walk the experience-point tree, resolve surveys, then pull button feedback for a period.
  x-realizes-capability-ids:
  - BC-430.50
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-430.50
      capability_name: Customer Feedback Management
      spec: happyornot-surveys-api-openapi.yml
      confidence: 0.78
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: buttonFeedbacksApi
  url: ../openapi/happyornot-button-feedbacks-api-openapi.yml
  type: openapi
- name: experiencePointsApi
  url: ../openapi/happyornot-experience-points-api-openapi.yml
  type: openapi
- name: surveysApi
  url: ../openapi/happyornot-surveys-api-openapi.yml
  type: openapi
workflows:
- workflowId: fetchButtonFeedback
  summary: List experience points, list surveys, then list button feedback for a window.
  inputs:
    type: object
    properties:
      period:
        type: string
        default: last-month
  steps:
  - stepId: listExperiencePoints
    operationId: listExperiencePoints
    parameters:
    - name: format
      in: path
      value: json
    outputs:
      experiencePointId: $response.body#/0/experiencePointId
  - stepId: listSurveys
    operationId: listSurveys
    parameters:
    - name: format
      in: path
      value: json
    outputs:
      surveyId: $response.body#/0/surveyId
  - stepId: listButtonFeedbacks
    operationId: listButtonFeedbacks
    parameters:
    - name: format
      in: path
      value: json
    - name: experiencePointId
      in: query
      value: $steps.listExperiencePoints.outputs.experiencePointId
    - name: period
      in: query
      value: $inputs.period
    outputs:
      feedbacks: $response.body
