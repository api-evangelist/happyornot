arazzo: 1.0.1
info:
  title: Monitor HappyOrNot alerts
  version: 1.0.0
  summary: Read alert specifications, poll triggered alerts, then read their comments.
  x-realizes-capability-ids:
  - BC-430.50
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-430.50
      capability_name: Customer Feedback Management
      spec: happyornot-alert-comments-api-openapi.yml
      confidence: 0.72
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: alertCommentsApi
  url: ../openapi/happyornot-alert-comments-api-openapi.yml
  type: openapi
- name: alertSpecificationsApi
  url: ../openapi/happyornot-alert-specifications-api-openapi.yml
  type: openapi
- name: alertsApi
  url: ../openapi/happyornot-alerts-api-openapi.yml
  type: openapi
workflows:
- workflowId: monitorAlerts
  summary: List alert specifications, list triggered alerts, then list alert comments.
  inputs:
    type: object
    properties:
      period:
        type: string
        default: today
  steps:
  - stepId: listAlertSpecifications
    operationId: listAlertSpecifications
    parameters:
    - name: format
      in: path
      value: json
    outputs:
      alertSpecificationId: $response.body#/0/alertSpecificationId
  - stepId: listAlerts
    operationId: listAlerts
    parameters:
    - name: format
      in: path
      value: json
    - name: period
      in: query
      value: $inputs.period
    outputs:
      alertId: $response.body#/0/alertId
  - stepId: listAlertComments
    operationId: listAlertComments
    parameters:
    - name: format
      in: path
      value: json
    outputs:
      comments: $response.body
