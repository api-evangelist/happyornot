paths:
  'token/introspect':
    get:
      tags:
        - token-introspection
      summary: Get token metadata
      description: |
        Returns metadata about the provided token, including its status, ID, name, and scopes.
        This endpoint is only available to the token's owner. Intended for self-service token management.
      responses:
        '200':
          description: Token is active and valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIntrospection'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
  '/results/button-feedbacks.{format}':
    get:
      tags:
        - button-feedbacks
      summary: List button feedbacks
      description: List button feedbacks that match the given parameters
      operationId: listButtonFeedbacks
      parameters:
        - $ref: '#/components/parameters/formatParam'
        - $ref: '#/components/parameters/csvSeparatorParam'
        - $ref: '#/components/parameters/surveyIdParam'
        - $ref: '#/components/parameters/experiencePointIdParam'
        - $ref: '#/components/parameters/periodParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
        - $ref: '#/components/parameters/includeMisuseParam'
        - $ref: '#/components/parameters/pagingOffsetParam'
        - $ref: '#/components/parameters/pagingLimitParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: successful button feedback listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ButtonFeedback'
            text/csv:
              schema:
                type: string
                description: CSV file with columns matching ButtonFeedback object properties
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
