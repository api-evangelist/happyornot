          type: integer
          format: int64
        surveyId:
          type: integer
          format: int64
        experiencePointId:
          type: integer
          format: int64
        alertSpecificationType:
          type: string
          enum: [negative, feedbackCount, indexThreshold]
        parameters:
          type: string
          pattern: '^(\w+=[\w,]*)( \w+=[\w,]*)*$'
          example: 'key1=value1 key2=value2 key3=value3a,value3b'
      required:
        - alertSpecificationId
        - surveyId
        - experiencePointId
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
          example: test@example.com
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        rootExperiencePointId:
          type: integer
          format: int64
        role:
          type: string
          enum: [USER,ADMIN,PARTNER]
        locale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        loginAllowed:
          type: boolean
          description: Is user allowed to log in
        loginMethod:
          type: string
          enum: [EMAIL_PASSWORD,SINGLE_SIGN_ON]
        lastLogin:
          type: string
          format: date-time
          description: Time in UTC of user's last login
        created:
          type: string
          format: date-time
          description: Time in UTC when user was created
      required:
        - userId
        - email
        - firstName
        - lastName
        - rootExperiencePointId
        - role
        - locale
        - loginAllowed
        - loginMethod
        - created
