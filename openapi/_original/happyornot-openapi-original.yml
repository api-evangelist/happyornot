security:
  - ApiTokenAuth: []
  - ApiTokenViaQueryStringAuth: []
components:
  parameters:
    formatParam:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum: [json,csv]
    csvSeparatorParam:
      name: csvSeparator
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1
        default: ","
      description: Applied only for CSV responses
    surveyIdParam:
      name: surveyId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Survey id that might have been acquired by using the /surveys endpoint
    experiencePointIdParam:
      name: experiencePointId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Experience point id that might have been acquired by using the /experience-points endpoint
    periodParam:
      name: period
      in: query
      required: false
      schema:
        type: string
        pattern: '^(today|yesterday|this-week|last-week|this-month|last-month|this-year|last-year|\d{4}(-(0[1-9]|1[0-2]|q[1-4]))?)$'
      description: If both period parameter and startDate/endDate are given, latter takes precedence. Week start is always Monday.
      example: today,last-year,2023-12,2023-q3
    startDateParam:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive start date. Defaults to current date. NOTE! startDate->endDate max interval is 1 year.
      example: 2023-09-26
    endDateParam:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Exclusive end date. Defaults to tomorrow. NOTE! startDate->endDate max interval is 1 year.
      example: 2023-09-27
    includeMisuseParam:
      name: includeMisuse
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: If true, also feedback that has been deemed misuse will be included in the response.
    includeSpamParam:
      name: includeSpam
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: If true, also feedback that has been deemed spam will be included in the response.
    pagingOffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Paging parameter to determine the index of the first item from the whole result set matching the search criteria.
    pagingLimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 1000
      description: Paging parameter to determine the maximum size of the result set matching the search criteria.
    orderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [desc,asc]
        default: asc
      description: Order parameter to sort feedbacks by time.
  schemas:
    TokenIntrospection:
      type: object
      required:
        - token_id
        - token_name
        - scopes
      properties:
        token_id:
          type: integer
          format: int64
          description: Unique identifier of the token.
        token_name:
          type: string
          description: Human-readable name of the token.
        scopes:
          type: array
          items:
            type: string
          description: List of scopes granted to the token.
    ButtonFeedback:
      type: object
      properties:
        feedbackId:
          type: string
          format: uuid
        smileyId:
          type: integer
          format: int64
        localTime:
          type: string
          format: date-time
          description: Time the feedback was given, in the time zone of the experience point in the survey
        surveyId:
          type: integer
          format: int64                
        experiencePointId:
          type: integer
          format: int64
        buttonIndex:
          type: integer
          minimum: 0
          maximum: 10
          description: Smaller value means more negative response. Possible values for four scale 0-3, five scale 0-4, NPS 0-10.
        misuse:
          type: boolean
          description: If true, the feedback was deemed to be misuse
        position:
          type: integer                                
          minimum: 0
          description: Position in the survey flow. Always 0 for button feedback, because this is always first.
        ui:
          type: string
          enum: [physical,digital,touchless,qr,link,email]
        smileyType:
          type: string
          enum: [SMILEY_TERMINAL,SMILEY_TOUCH,SMILEY_DIGITAL]
      required:
        - feedbackId
        - smileyId
        - localTime
        - surveyId
        - experiencePointId
        - buttonIndex
        - misuse
        - position
        - smileyType
    FollowupFeedback:
      type: object
      properties:
        feedbackId:
          type: string
          format: uuid
        smileyId:
          type: integer
          format: int64
        localTime:
          type: string
          format: date-time
          description: Time the feedback was given, in the time zone of the experience point in the survey
        surveyId:
          type: integer
          format: int64                
        experiencePointId:
          type: integer
          format: int64
        buttonIndex:
          type: integer
          minimum: 0
          maximum: 10
          description: buttonIndex that was given at button feedback phase. Available here for convenience. See details from Button Feedback docs.
        misuse:
          type: boolean
          description: If true, the feedback was deemed to be misuse
        position:
          type: integer
          minimum: 0
          description: Position in the survey flow. 0 being the first phase.
        ui:
          type: string
          enum: [physical,digital,exit,skip,timeout,touchless,qr,link,email]
        smileyType:
          type: string
          enum: [SMILEY_TERMINAL,SMILEY_TOUCH,SMILEY_DIGITAL]
        followupQuestionId:
          type: integer
          format: int64
        followupOptionId:
          type: integer
          format: int64
        followupOptionTextInDefaultLocale:
          type: string
      required:
        - feedbackId
        - smileyId
        - localTime
        - surveyId
        - experiencePointId
        - buttonIndex
        - misuse
        - position
        - smileyType
        - followupOptionId
    TextFeedback:
      type: object
      properties:
        feedbackId:
          type: string
          format: uuid
        smileyId:
          type: integer
          format: int64
        localTime:
          type: string
          format: date-time
          description: Time the feedback was given, in the time zone of the experience point in the survey
        surveyId:
          type: integer
          format: int64                
        experiencePointId:
          type: integer
          format: int64
        buttonIndex:
          type: integer
          minimum: 0
          maximum: 10
          description: buttonIndex that was given at button feedback phase. Available here for convenience. See details from Button Feedback docs.
        misuse:
          type: boolean
          description: If true, the feedback was deemed to be misuse
        position:
          type: integer
          minimum: 0
          description: Position in the survey flow. 0 being the first phase.
        ui:
