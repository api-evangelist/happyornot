        - followupOptionId
        - followupQuestionId
    FollowupOptionLocalization:
      type: object
      properties:
        followupOptionId:
          type: integer
          format: int64
        locale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        text:
          type: string
      required:
        - followupOptionId
        - locale
        - text
    Alert:
      type: object
      properties:
        alertId:
          type: integer
          format: int64
        alertSpecificationId:
          type: integer
          format: int64
        surveyId:
          type: integer
          format: int64
        experiencePointId:
          type: integer
          format: int64
        beginTime:
          type: string
          format: date-time
          description: Time when alert was triggered, in experience point's local time
        endTime:
          type: string
          format: date-time
          description: Time when alert was closed, in experience point's local time. If empty, alert is still open.
        alertSpecificationType:
          type: string
          enum: [negative, feedbackCount, indexThreshold]
        parameters:
          type: string
          pattern: '^(\w+=[\w,]*)( \w+=[\w,]*)*$'
          example: 'key1=value1 key2=value2 key3=value3a,value3b'
        acknowledged:
          type: boolean
          description: Is the alert acknowledged or not
        acknowledgedByUserId:
          type: integer
          format: int64
          description: HappyOrNot Analytics user id who acknowledged the alert.
        acknowledgedTime:
          type: string
          format: date-time
          description: Time when alert was acknowledged, in experience point's local time.
      required:
        - alertId
        - alertSpecificationId
        - surveyId
        - experiencePointId
        - beginTime
        - alertSpecificationType
        - parameters
        - acknowledged
    AlertComment:
      type: object
      properties:
        alertCommentId:
          type: integer
          format: int64
        alertId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        comment:
          type: string
      required:
        - alertCommentId
        - alertId
        - userId
        - time
        - comment
    AlertSpecification:
