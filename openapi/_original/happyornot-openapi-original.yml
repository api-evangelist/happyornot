openapi: 3.1.0
info:
  title: HappyOrNot Customer API v2
  description: |
    ### HappyOrNot Customer API v2 is designed for
    * fetching feedbacks of all type (button, followups, text, demographics, contact details)
    * fetching information about experience points, surveys and other
      metadata related to fetching and displaying feedback
    * fetching information about users of HappyOrNot Analytics
    * fetching information about smileys, that is the physical devices or digital tokens for feedback gathering

    ### Useful links:
    * [HappyOrNot website](https://www.happy-or-not.com)
    * [HappyOrNot Analytics](https://reporting.happy-or-not.com)

    ### Base URL for API calls:
    https://api.happy-or-not.com/v2/<br>
    Example:<br>
    https://api.happy-or-not.com/v2/experience-points.json

    ### Entities explained
    **Experience point** = Represents a point of interaction for feedback gathering.<br>
    Can represent a physical location, e.g. "London Store 1" or a digital location, e.g. "Webshop checkout".<br>
    **Group** = Represents a grouping of experience points. Grouping can be e.g. geographical or organizational.<br>
    Examples are countries, cities or organization functions.<br>
    Groups and Experience points form a hierarchical tree structure, see example below.<br>
    **Survey** = Time-bounded surveys that contain a question and are associated with one or more experience points.<br>
    **Question** = Localizable questions are associated to surveys, e.g. "How was the service?"<br>
    **Smiley** = Physical or digital "device" that collect feedback. Smiley is associated with an experience point.<br>
    Types of smileys are Smiley Terminal, Smiley Touch and Smiley Digital.<br>
    **User** = User account of HappyOrNot Analytics, identified by email address and name. Has an associated role and data access.<br>
    <br>
    **Example for group / experience point hierarchy:**<br>
    <pre>
    * Company X <- this is root group and parent of Finland and Sweden
      * Finland  <- this group is parent for Helsinki and Tampere store experience points
        * Helsinki store <- this is an experience point
        * Tampere store <- this is an experience point
      * Sweden <- this group is parent for Stockholm and Malmö store experience points
        * Stockholm store <- this is an experience point
        * Malmö store <- this is an experience point
    </pre>
    ### Feedback types explained
    **Button Feedback** = The feedback type that is always present in surveys.<br>
    Visually represented as 4 or 5 smiley faces or NPS scale (0..10).<br>
    **Followup Feedback** = Predefined set of selectable textual values (max 6) to explain the button feedback given.<br>
    **Text Feedback** = Freeform text feedback. Available in Smileys that support keyboard input.<br>
    **Demographics** = AI based estimate on feedback giver's age and gender. Supported by Smiley Touch only.<br>
    **Contact Details** = If a feedback giver wants to get contacted, name and email or phone number can be given.<br>
    **Metadata** = Arbitrary set of key-value pairs related to this particular feedback.

    ### Entity Relationships Diagrams
    <img alt="Entity Relationships Diagram" src="er-diagram.svg"/>
    <img alt="Entity Relationships Diagram for feedbacks" src="er-diagram-feedbacks.svg"/>

    ### Authentication/Authorisation
    Authentication and authorisation is based on a *token*.
    You can generate API v2 tokens in your *Organization Settings* page at HappyOrNot Analytics (you need to have Admin privileges to access that page).
    You should provide a token with a request in one of the two ways:<br>
    * Request Header *X-HON-API-Token*. E.g. X-HON-API-Token: your-token-here (Suggested way)
    * Query string parameter *auth*. E.g. /v2/experience-points.json?auth=your-token-here (Ok for testing)<br>

    #### Token introspection
    For a valid authenticated token it is possible to requests metadata, including token id, name and scopes.

    ### Paging:
    Paging of responses is controlled using *offset* and *limit* parameters.<br>
    HTTP response header *X-More-Available* (value "true" or "false") can be used to determine if more data is available.<br>
    Example:<br>
    https://api.happy-or-not.com/v2/alerts.json?offset=0&limit=500<br>
    <br>
    HTTP response header *Link* is provided (if above described X-More-Available: true) and it includes the link to next page of results.<br>
    Example:<br>
    Link: <https://api.happy-or-not.com/v2/alerts.json?offset=500&limit=500>; rel="next"<br>

    ### Terms mapping between API v1 and API v2
    <pre>
    API v1			API v2
    -----------------------------------------------------------------------
    N/A			Token Introspection
    Results/Rawresults	Button Feedbacks
    Results/Rawresults	Follow-up Feedbacks
    Results/Rawresults	Text Feedbacks
    N/A			Demographics
    N/A			Contact Details
    N/A                     Metadata
    Folders/Children	Groups and Experience Points
    Surveys			No direct mapping available, but v1 surveys are mappings of v2 Experience Points to v2 Surveys
    Questions		Surveys
    N/A 			Question
    N/A			Follow-up questions
    N/A			Follow-up options
    Alerts			Alerts
    N/A			Alert Specifications
    N/A			Alert Comments
    N/A			Users
    N/A			Smileys
    N/A			Custom Data Fields
    N/A			All localizations
    </pre>
    <br>

    ### Need help?
    Please email support@happy-or-not.com to get more assistance.

