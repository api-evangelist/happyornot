        - smileyType
        - key
        - value
    ExperiencePoint:
      type: object
      properties:
        experiencePointId:
          type: integer
        name:
          type: string
        parent:
          type: integer
        type:
          type: string
          enum: [GROUP, EXPERIENCE-POINT]
      required:
        - experiencePointId
        - name
        - type
    CompanyCustomDataField:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        options:
          type: array
          items:
            type: string
      required:
        - id
        - label
        - type
    CustomDataField:
      type: object
      properties:
        experiencePointId:
          type: integer
        label:
          type: string
        value:
          type: string
      required:
        - experiencePointId
        - label
    Survey:
      type: object
      properties:
        surveyId:
          type: integer
          format: int64
        questionId:
          type: integer
          format: int64
        defaultLocale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        questionTextInDefaultLocale:
          type: string
          example: 'How was the service?'
        surveyType:
          type: string
          enum: [CUSTOMER, EMPLOYEE]
        feedbackScale:
          type: string
          enum: [four, five, five_reversed, nps]
        indexType:
          type: string
          enum: [HAPPY, NPS, NPS_OFFICIAL, AVERAGE]
        state:
          type: string
          enum: [active,ended,upcoming]
      required:
        - surveyId
        - questionId
        - defaultLocale
        - questionTextInDefaultLocale
        - surveyType
        - feedbackScale
        - indexType
        - state
    Question:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        defaultLocale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        questionTextInDefaultLocale:
          type: string
          example: 'How was the service?'
      required:
        - questionId
        - defaultLocale
        - questionTextInDefaultLocale
    QuestionLocalization:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        locale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        text:
          type: string
          example: How was the service?
      required:
        - questionId
        - locale
        - text
    FollowupQuestion:
      type: object
      properties:
        followupQuestionId:
          type: integer
          format: int64
        surveyId:
          type: integer
          format: int64
        positive:
          type: boolean
        questionTextInDefaultLocale:
          type: string
          example: 'What was particularly good?'
          description: NOTE! This might be empty if default locale has been changed
      required:
        - followupQuestionId
        - surveyId
        - positive
    FollowupQuestionLocalization:
      type: object
      properties:
        followupQuestionId:
          type: integer
          format: int64
        locale:
          type: string
          pattern: '^[a-z]{2}(_[A-Z]{2})?$'
          example: en_US
        text:
          type: string
      required:
        - followupQuestionId
        - locale
        - text
    FollowupOption:
